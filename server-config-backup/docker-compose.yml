services:
  mc:
    image: itzg/minecraft-server:java8
    container_name: hbm-server
    tty: true
    stdin_open: true
    restart: unless-stopped

    ports:
      # Наружу проброшен 25567, внутри контейнера всегда 25565
      - "25567:25565"

    environment:
      EULA: "TRUE"

      # --- Платформа ---
      TYPE: "FORGE"
      VERSION: "1.12.2"
      FORGE_VERSION: "14.23.5.2860"

      # --- Память и JVM ---
      # Xms и Xmx выставятся одинаковыми автоматически
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "TRUE"

      # Критично для тяжёлого пака: отключает watchdog, который
      # убивает сервер при долгом тике (генерация чанков, взрывы HBM)
      MAX_TICK_TIME: "-1"

      # --- Сервер ---
      ONLINE_MODE: "FALSE"
      ALLOW_FLIGHT: "TRUE"
      MOTD: "HBM CE"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "4"
      VIEW_DISTANCE: "8"
      LEVEL_TYPE: "lostcities_bop"   # BOP-биомы + руины Lost Cities прямо в оверворлде (~2% чанков — города)
      GENERATOR_SETTINGS: '{"profile":"default"}'   # профиль генерации LC: больше завалов/лута из руин
      SPAWN_PROTECTION: "0"
      # OPS: "6VanDarkholme9, gamahyss, PalLaich, Feanor" 

      # --- Команды при старте (через RCON) ---
      RCON_CMDS_STARTUP: |
        gamerule keepInventory true
        gamerule doFireTick true
      BROADCAST_RCON_TO_OPS: "TRUE"

      # --- Автопауза ---
      # Сервер замораживается, когда никого нет, и просыпается
      # при попытке подключения. Требует MAX_TICK_TIME=-1 (см. выше),
      # иначе watchdog убьёт сервер при пробуждении.
      ENABLE_AUTOPAUSE: "TRUE"
      AUTOPAUSE_TIMEOUT_EST: "1800"   # 30 мин после ухода последнего игрока
      AUTOPAUSE_TIMEOUT_INIT: "900"   # 15 мин после старта, если никто не зашёл
      AUTOPAUSE_TIMEOUT_KN: "120"     # ожидание после стука в порт
      AUTOPAUSE_PERIOD: "10"

      # --- Моды через packwiz ---
      # file:// поддерживается (itzg/docker-minecraft-server#1487, PR #1488).
      # Папка пака смонтирована ниже в /packwiz только на чтение.
      # Пак обрабатывается раньше MODS/MODPACK, а клиентские моды
      # (side = "client") установщик пропускает сам.
      PACKWIZ_URL: "file:///packwiz/pack.toml"

      TZ: "Europe/Moscow"

    volumes:
      # Весь мир, конфиги и моды живут здесь
      - ./data:/data
      # Папка с pack.toml — правьте пак на хосте, сервер подхватит при рестарте
      - /home/mkass420/hbm/hbm-modpack:/packwiz:ro

  backup:
    image: itzg/mc-backup
    container_name: hbm-backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "15m"
      PRUNE_BACKUPS_DAYS: "7"
      RCON_HOST: "mc"
      # Не будить сервер ради бэкапа, если все спят
      PAUSE_IF_NO_PLAYERS: "true"
      INITIAL_DELAY: "5m"
      TZ: "Europe/Moscow"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"

  skins:
    image: nginx:alpine
    container_name: hbm-skins
    restart: unless-stopped
    ports:
      - "25568:80"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
